[package]
name = "pdfcraft"
version = "0.1.0"
description = "PDFCraft desktop PDF workspace"
authors = ["PDFCraft"]
edition = "2021"

[lib]
name = "pdfcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
